<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Easy Checklist</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

		:root {
			--ink: #17352a;
			--muted: #6a8175;
			--forest: #123b2d;
			--leaf: #2f7d4f;
			--lime: #b4d86b;
			--mint: #e7f1dd;
			--paper: #f7f6ef;
			--line: #d8e4d6;
			--white: #fffefa;
			--shadow: 0 24px 70px rgba(24, 66, 42, .12);
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			color: var(--ink);
			background: var(--paper);
			font-family: 'DM Sans', sans-serif;
			overflow-x: hidden;
		}
		body::before {
			content: '';
			position: fixed;
			inset: -20% -5% auto auto;
			width: 50vw;
			height: 60vh;
			background: radial-gradient(ellipse at top right, rgba(180, 216, 107, .34), transparent 64%);
			pointer-events: none;
		}
		.shell { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 52px 0 64px; position: relative; }
		header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 36px; }
		.eyebrow { color: var(--leaf); font-size: .72rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
		h1 { margin: 9px 0 7px; color: var(--forest); font: 700 clamp(2.2rem, 5vw, 4.3rem)/.98 'Playfair Display', serif; letter-spacing: 0; }
		.intro { margin: 0; color: var(--muted); font-size: 1rem; }
		.date-badge { padding: 13px 16px; border: 1px solid var(--line); border-radius: 4px; color: var(--leaf); background: rgba(255, 254, 250, .64); font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
		.dashboard { display: grid; grid-template-columns: 1.05fr 1.8fr; gap: 20px; align-items: stretch; }
		.progress-card, .list-card { border: 1px solid var(--line); background: rgba(255, 254, 250, .86); box-shadow: var(--shadow); }
		.progress-card { display: flex; flex-direction: column; justify-content: space-between; min-height: 450px; padding: 28px; border-radius: 6px; background: var(--forest); color: white; overflow: hidden; position: relative; }
		.progress-card::after { content: ''; position: absolute; width: 220px; height: 220px; right: -100px; bottom: -100px; border: 1px solid rgba(180, 216, 107, .32); border-radius: 50%; box-shadow: 0 0 0 22px rgba(180, 216, 107, .06), 0 0 0 46px rgba(180, 216, 107, .05); }
		.card-label { color: var(--lime); font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
		.ring-wrap { display: grid; place-items: center; margin: 12px 0; position: relative; }
		.ring { width: 190px; height: 190px; transform: rotate(-90deg); }
		.ring-track { fill: none; stroke: rgba(255, 255, 255, .13); stroke-width: 10; }
		.ring-value { fill: none; stroke: var(--lime); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 471; stroke-dashoffset: 471; transition: stroke-dashoffset .55s ease; }
		.ring-number { position: absolute; color: white; font: 700 3rem/.9 'Playfair Display', serif; }
		.ring-number small { display: block; margin-top: 9px; color: rgba(255,255,255,.62); font: 500 .73rem 'DM Sans', sans-serif; text-align: center; letter-spacing: .12em; text-transform: uppercase; }
		.quote { max-width: 230px; margin: 0; color: rgba(255,255,255,.72); font-size: .9rem; line-height: 1.6; }
		.list-card { border-radius: 6px; padding: 25px 26px 18px; }
		.list-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 17px; }
		.list-title { margin: 0; color: var(--forest); font: 700 1.65rem 'Playfair Display', serif; }
		.add-btn { border: 0; border-radius: 3px; padding: 11px 15px; color: var(--forest); background: var(--lime); font: 700 .8rem 'DM Sans', sans-serif; cursor: pointer; transition: transform .2s, background .2s; }
		.add-btn:hover { background: #c5e487; transform: translateY(-2px); }
		.filters { display: flex; gap: 6px; padding: 17px 0 6px; }
		.filter { border: 0; border-radius: 20px; padding: 7px 11px; color: var(--muted); background: transparent; font: 600 .77rem 'DM Sans', sans-serif; cursor: pointer; }
		.filter.active { color: var(--leaf); background: var(--mint); }
		#task-list { margin: 0; padding: 0; list-style: none; }
		.task { display: flex; align-items: center; gap: 13px; padding: 17px 0; border-bottom: 1px solid #e5ece2; animation: rise .35s ease both; }
		.task:last-child { border-bottom: 0; }
		.check { display: grid; flex: 0 0 22px; place-items: center; width: 22px; height: 22px; border: 1.5px solid #aac5ad; border-radius: 50%; background: transparent; color: white; cursor: pointer; transition: .2s; }
		.check svg { width: 13px; opacity: 0; transform: scale(.6); transition: .2s; }
		.task.done .check { border-color: var(--leaf); background: var(--leaf); }
		.task.done .check svg { opacity: 1; transform: scale(1); }
		.task-text { flex: 1; min-width: 0; font-size: .92rem; line-height: 1.35; transition: color .2s, opacity .2s; }
		.task.done .task-text { color: #91a599; text-decoration: line-through; }
		.tag { padding: 4px 8px; border-radius: 3px; background: var(--mint); color: var(--leaf); font-size: .65rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
		.remove { border: 0; padding: 5px; color: #aac0b0; background: transparent; cursor: pointer; font-size: 1.15rem; line-height: 1; }
		.remove:hover { color: #ba6b57; }
		.empty { padding: 34px 0; color: var(--muted); text-align: center; font-size: .88rem; }
		.footnote { display: flex; justify-content: space-between; gap: 16px; margin-top: 19px; color: var(--muted); font-size: .76rem; }
		.clear { border: 0; padding: 0; color: var(--leaf); background: none; font: inherit; cursor: pointer; }
		.clear:hover { text-decoration: underline; }
		@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 720px) {
			.shell { width: min(100% - 28px, 520px); padding-top: 30px; }
			header { margin-bottom: 25px; }
			.date-badge { display: none; }
			.dashboard { grid-template-columns: 1fr; }
			.progress-card { min-height: 330px; padding: 24px; }
			.ring { width: 145px; height: 145px; }
			.ring-number { font-size: 2.4rem; }
			.quote { max-width: 100%; }
			.list-card { padding: 21px 18px 14px; }
			.tag { display: none; }
		}
	</style>
</head>
<body>
	<main class="shell">
		<header>
			<div>
				<div class="eyebrow">Tu espacio de enfoque</div>
				<h1>Easy<br />Checklist</h1>
				<p class="intro">Para lo que quieras apuntar y cumplir.</p>
			</div>
			<div class="date-badge" id="date-label"></div>
		</header>

		<section class="dashboard" aria-label="Resumen y tareas">
			<aside class="progress-card">
				<div class="card-label">Progreso de hoy</div>
				<div class="ring-wrap">
					<svg class="ring" viewBox="0 0 180 180" aria-hidden="true">
						<circle class="ring-track" cx="90" cy="90" r="75"></circle>
						<circle class="ring-value" id="ring-value" cx="90" cy="90" r="75"></circle>
					</svg>
					<div class="ring-number" id="progress-number">0%<small>completado</small></div>
				</div>
				<p class="quote" id="progress-copy">Cada tarea terminada abre un poco más el camino.</p>
			</aside>

			<section class="list-card">
				<div class="list-top">
					<h2 class="list-title">Tareas de hoy</h2>
					<button class="add-btn" id="add-task" type="button">+ Añadir tarea</button>
				</div>
				<nav class="filters" aria-label="Filtrar tareas">
					<button class="filter active" data-filter="all" type="button">Todas</button>
					<button class="filter" data-filter="active" type="button">Pendientes</button>
					<button class="filter" data-filter="done" type="button">Completadas</button>
				</nav>
				<ul id="task-list"></ul>
				<div class="footnote"><span id="task-count"></span><button class="clear" id="clear-done" type="button">Limpiar completadas</button></div>
			</section>
		</section>
	</main>

	<script>
		const starterTasks = [
			{ text: 'Beber un vaso de agua al despertar', tag: 'bienestar', done: true },
			{ text: 'Elegir las tres prioridades del día', tag: 'enfoque', done: false },
			{ text: 'Hacer una pausa consciente de 10 minutos', tag: 'energía', done: false },
			{ text: 'Cerrar el día anotando un aprendizaje', tag: 'reflexión', done: false }
		];
		let tasks = JSON.parse(localStorage.getItem('canopy-tasks') || 'null') || starterTasks;
		let currentFilter = 'all';
		const list = document.querySelector('#task-list');

		document.querySelector('#date-label').textContent = new Intl.DateTimeFormat('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }).format(new Date());

		function save() { localStorage.setItem('canopy-tasks', JSON.stringify(tasks)); }
		function render() {
			const visible = tasks.filter(task => currentFilter === 'all' || (currentFilter === 'done' ? task.done : !task.done));
			list.innerHTML = visible.length ? visible.map((task, index) => {
				const realIndex = tasks.indexOf(task);
				return `<li class="task ${task.done ? 'done' : ''}" style="animation-delay:${index * 45}ms">
					<button class="check" data-index="${realIndex}" aria-label="${task.done ? 'Marcar pendiente' : 'Marcar completada'}">
						<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 8 3 3 7-7" /></svg>
					</button>
					<span class="task-text">${escapeHtml(task.text)}</span><span class="tag">${escapeHtml(task.tag)}</span>
					<button class="remove" data-remove="${realIndex}" aria-label="Eliminar tarea">&times;</button>
				</li>`;
			}).join('') : '<li class="empty">No hay tareas en este filtro.</li>';
			const completed = tasks.filter(task => task.done).length;
			const percent = tasks.length ? Math.round(completed / tasks.length * 100) : 0;
			document.querySelector('#progress-number').innerHTML = `${percent}%<small>completado</small>`;
			document.querySelector('#ring-value').style.strokeDashoffset = 471 - (471 * percent / 100);
			document.querySelector('#task-count').textContent = `${tasks.length - completed} ${tasks.length - completed === 1 ? 'tarea pendiente' : 'tareas pendientes'}`;
			document.querySelector('#progress-copy').textContent = percent === 100 ? 'Todo lo importante está hecho. Qué buen cierre.' : 'Cada tarea terminada abre un poco más el camino.';
		}
		function escapeHtml(value) { return value.replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character])); }

		list.addEventListener('click', event => {
			const check = event.target.closest('[data-index]');
			const remove = event.target.closest('[data-remove]');
			if (check) tasks[check.dataset.index].done = !tasks[check.dataset.index].done;
			if (remove) tasks.splice(remove.dataset.remove, 1);
			if (check || remove) { save(); render(); }
		});
		document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
			currentFilter = button.dataset.filter;
			document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button));
			render();
		}));
		document.querySelector('#add-task').addEventListener('click', () => {
			const text = prompt('¿Qué quieres añadir a tu ritual?');
			if (text && text.trim()) { tasks.push({ text: text.trim(), tag: 'nuevo', done: false }); save(); currentFilter = 'all'; document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item.dataset.filter === 'all')); render(); }
		});
		document.querySelector('#clear-done').addEventListener('click', () => { tasks = tasks.filter(task => !task.done); save(); render(); });
		render();

		if ('serviceWorker' in navigator && (window.isSecureContext || location.hostname === 'localhost')) {
			navigator.serviceWorker.register('./sw.js').catch(error => console.error('No se pudo registrar el service worker:', error));
		}
	</script>
</body>
</html>
